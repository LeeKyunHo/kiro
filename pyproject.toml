[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-charaset"
version = "2.0.0"
description = "캐릭터 챗봇용 이미지 에셋 배치 생성 파이프라인 (SD WebUI API)"
readme = "PROJECT_GUIDE.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "LeeKyunHo" }]
keywords = ["stable-diffusion", "webui", "batch", "asset-pipeline", "chatbot"]

# 의존성을 최소로 유지한다. 검증 도구를 포함해 전량이 이 둘로 동작한다.
dependencies = [
    "requests>=2.28",
    "Pillow>=9.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
# pip install -e . 후 `charaset --test` 로 실행 가능
charaset = "sd_charaset.cli:main"

[tool.setuptools]
packages = ["sd_charaset"]

# ─────────────────────────────────────────────
# ruff
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RET",  # return
    "PTH",  # pathlib 사용 강제
]
ignore = [
    "E501",  # line-length 는 formatter 가 처리
]

[tool.ruff.lint.per-file-ignores]
# 진단 모듈은 픽스처와 단정문이 많아 복잡도 규칙이 과하다.
"sd_charaset/diagnostics.py" = ["B011", "SIM117"]
# shim 은 sys.path 조정 후 import 가 필요하다.
"sd_batch_generator.py" = ["E402"]

# ─────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["PIL.*", "requests.*"]
ignore_missing_imports = true
